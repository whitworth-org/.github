name: test-octo-sts-policy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  test-federation:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange OIDC token via octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: whitworth-org/.github
          identity: github-actions

      - name: Verify token can read bedrock repo contents
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          echo "::group::List bedrock repo contents"
          gh api repos/whitworth-org/bedrock/contents --jq '.[].name'
          echo "::endgroup::"

      - name: Verify token can read .github repo contents
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          echo "::group::List .github repo contents"
          gh api repos/whitworth-org/.github/contents --jq '.[].name'
          echo "::endgroup::"

      - name: Verify token is scoped to listed repos only
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          echo "::group::Verify token lists only scoped repos"
          repos=$(gh api /installation/repositories --jq '.repositories[].full_name' | sort)
          echo "Accessible repos: ${repos}"
          expected=$'whitworth-org/.github\nwhitworth-org/bedrock'
          if [ "${repos}" != "${expected}" ]; then
            echo "::error::Token can access unexpected repos: ${repos}"
            exit 1
          fi
          echo "Token correctly scoped to bedrock and .github only"
          echo "::endgroup::"
