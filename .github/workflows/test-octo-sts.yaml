name: test-octo-sts-policy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  test-federation:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange OIDC token via octo-sts
        uses: octo-sts/action@6177b4481c00308b3839969c3eca88c96a91775f # v1.0.0
        id: octo-sts
        with:
          scope: whitworth-org/.github
          identity: github-actions

      - name: Verify token can read bedrock repo contents
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          echo "::group::List bedrock repo contents"
          gh api repos/whitworth-org/bedrock/contents --jq '.[].name'
          echo "::endgroup::"

      - name: Verify token can read .github repo contents
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          echo "::group::List .github repo contents"
          gh api repos/whitworth-org/.github/contents --jq '.[].name'
          echo "::endgroup::"

      - name: Verify token CANNOT write (negative test)
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          echo "::group::Attempt to create an issue (should fail with 403)"
          if gh api repos/whitworth-org/bedrock/issues -f title="test" -f body="test" 2>&1; then
            echo "::error::Write succeeded when it should have been denied"
            exit 1
          else
            echo "Write correctly denied — token is read-only"
          fi
          echo "::endgroup::"
